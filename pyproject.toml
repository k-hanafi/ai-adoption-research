[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-adoption-research"
version = "0.1.0"
description = "Checkout install. Prompts and panels stay files next to the code, not files inside a wheel."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "perplexityai",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = []
